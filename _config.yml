title: Mitchele Jebet
email: jebetmitchele@gmail.com
description: >-
  Security engineer building AI-powered detection systems and open source
  security tooling. Specialising in threat detection, incident response,
  and AI security — on the path to Security Architecture.
twitter_username: 
github_username: Girlweb
minimal_mistakes_skin: dark
search: true

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes
permalink: /:categories/:title/
paginate: 5
paginate_path: /page:num/
timezone: Africa/Nairobi

include:
  - _pages

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

author:
  name: "Mitchele Jebet"
  avatar: "/assets/images/bio-photo.jpg"
  bio: "Security engineer | Threat Detection & AI-Powered Automation | Building open source security tooling for Africa 🔒"
  location: "Nairobi, Kenya"
  links:
    - label: "Portfolio"
      icon: "fas fa-fw fa-link"
      url: "https://mitchele-jebet.pages.dev"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/mitchele-jebet"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/Girlweb"
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:jebetmitchele@gmail.com"

footer:
  links:
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/mitchele-jebet"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/Girlweb"
    - label: "Portfolio"
      icon: "fas fa-fw fa-link"
      url: "https://mitchele-jebet.pages.dev"

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
